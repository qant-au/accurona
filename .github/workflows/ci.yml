# Every push to main and every pull request: the same build and tests the
# Publish workflow runs before a release, so a dependency bump or a change is
# checked before it is tagged rather than at release time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
