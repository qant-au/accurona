# A release: push a v* tag whose version matches all three packages
# (@accurona/elements, @accurona/core, @accurona/ui). Builds, tests, and
# publishes them to npm with provenance, through npm Trusted Publishing: no
# token, each package trusts this workflow on npmjs.com.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The tag matches every package's version
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            for (const file of ["package.json", "packages/core/package.json", "packages/ui/package.json"]) {
              const { name, version } = require("./" + file);
              if (version !== tag) {
                console.error(`${name} is ${version}, the tag is ${tag}`);
                process.exit(1);
              }
            }
          '
      # A re-pushed or re-run tag whose version is already on npm has nothing to
      # publish: succeed without publishing instead of failing on "cannot
      # publish over". A version that is only partly published still fails.
      - name: Skip when this version is already on npm
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          for name in @accurona/elements @accurona/core @accurona/ui; do
            if [ -z "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "already=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Every package is already on npm at $version; nothing to publish."
          echo "already=true" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.already != 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.published.outputs.already != 'true'
        run: npm publish --workspaces --include-workspace-root --provenance --access public
