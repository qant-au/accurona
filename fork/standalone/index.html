<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accurona</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070b14;
      }
      #plan {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="plan"></div>
    <script type="module">
      // The planner on its own: the plan is kept in this browser, and there is no live data.
      // ?plan=<name> keeps a separate plan; ?fresh starts an empty one in memory (nothing kept).
      import { browserStore, memoryStore, mountAccurona } from "./accurona-host.js";

      const params = new URLSearchParams(location.search);
      const store = params.has("fresh") ? memoryStore() : browserStore(params.get("plan") ?? "default");
      window.accurona = await mountAccurona(document.querySelector("#plan"), { store, language: params.get("lang") ?? undefined });
    </script>
  </body>
</html>
