server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The same policy the Axonometra container serves: no 'unsafe-eval', and
    # no fetch() of data: URLs. The packages have to work under it.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
